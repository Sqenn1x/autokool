version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myautokool_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./www/autokool:/var/www/html   # <--- Указываем папку www в качестве корня сайта
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=secret
      - DB_NAME=autokool
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: myautokool_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: autokool
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: